<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>커피 원정대 | Coffee Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef3e2;
    --bg-vignette:#e3ecd2;
    --surface:#fbfdf6;
    --surface-2:#eef2df;
    --ink:#26331f;
    --ink-dim:#6d7c5f;
    --adventure:#3f7d4a;
    --forest:#2c5c37;
    --sky:#5c8aa0;
    --gold:#d9a441;
    --gold-ink:#a9701d;
    --on-accent:#fbfdf6;
    --line:rgba(38,51,31,0.14);
    --line-strong:rgba(38,51,31,0.30);
    --radius:20px;
    --radius-sm:12px;
    --shadow:0 16px 34px rgba(50,74,40,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 6%, rgba(92,138,160,0.16), transparent 42%),
      radial-gradient(circle at 90% 94%, rgba(63,125,74,0.20), transparent 46%),
      var(--bg-vignette);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    padding:28px 22px 40px;
    display:flex;
    flex-direction:column;
  }
  /* decorative compass rings, like a well-worn treasure map */
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:1.5px dashed rgba(63,125,74,0.30);
    pointer-events:none;
  }
  .frame::before{ width:340px; height:340px; top:-140px; right:-160px; }
  .frame::after{ width:220px; height:220px; bottom:-90px; left:-100px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; font-weight:600; }

  .screen{ display:none; flex-direction:column; flex:1; animation:fade .45s ease both; }
  .screen.active{ display:flex; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---------- START SCREEN ---------- */
  #screen-start{ justify-content:space-between; }
  .start-top{ margin-top:38px; }
  .start-top h1{
    font-size:clamp(30px,8vw,40px);
    line-height:1.25;
    margin-top:14px;
    font-style:italic;
    font-weight:500;
  }
  .start-top p{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.65;
    margin-top:14px;
  }
  .compass-icon{ width:40px; height:40px; color:var(--gold-ink); }
  .start-meta{
    display:flex;
    gap:18px;
    margin-top:28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  .start-meta div{ display:flex; flex-direction:column; gap:4px; }
  .start-meta b{ color:var(--ink); font-size:18px; font-family:'Fraunces',serif; }

  .btn-primary{
    background:linear-gradient(135deg,var(--adventure),#c74a22);
    color:var(--on-accent);
    border:none;
    border-radius:999px;
    padding:17px 20px;
    font-size:16px;
    font-weight:600;
    font-family:'IBM Plex Sans KR',sans-serif;
    width:100%;
    cursor:pointer;
    box-shadow:0 12px 24px rgba(63,125,74,0.30);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:active{ transform:scale(0.98); box-shadow:0 6px 14px rgba(63,125,74,0.26); }

  .btn-ghost{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:14px 18px;
    font-size:14px;
    font-weight:500;
    font-family:'IBM Plex Sans KR',sans-serif;
    width:100%;
    cursor:pointer;
    margin-top:10px;
  }

  /* ---------- SURVEY SCREEN ---------- */
  .survey-top{ display:flex; align-items:center; gap:12px; }
  .back-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:18px;
  }
  .back-btn:disabled{ opacity:0.3; cursor:default; }

  .roast-gauge{
    flex:1;
    height:10px;
    border-radius:999px;
    background:linear-gradient(90deg,#cfe3b8,#8fbf98,#6f93a9,#3f5a63);
    background-size:400% 100%;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .roast-gauge .mask{
    position:absolute; top:0; right:0; bottom:0;
    background:var(--surface);
    transition:width .35s ease;
  }
  .q-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    white-space:nowrap;
  }

  .q-card{
    margin-top:34px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 22px 22px;
    flex:1;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
  }
  .q-text{
    font-size:clamp(19px,5.4vw,22px);
    line-height:1.5;
    font-weight:600;
    font-family:'Fraunces',serif;
  }
  .options{
    margin-top:auto;
    padding-top:26px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt-btn{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    color:var(--ink);
    font-size:15px;
    font-family:'IBM Plex Sans KR',sans-serif;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt-btn .dot{
    width:10px;height:10px;border-radius:50%;
    border:1.5px solid var(--ink-dim);
    flex-shrink:0;
  }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn.selected{
    border-color:var(--adventure);
    background:rgba(63,125,74,0.14);
  }
  .opt-btn.selected .dot{ background:var(--adventure); border-color:var(--adventure); }

  /* ---------- LOADING ---------- */
  #screen-loading{ align-items:center; justify-content:center; text-align:center; gap:16px; }
  .brew-spinner{ width:56px; height:56px; animation:spin 1.4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #screen-loading p{ color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:13px; }

  /* ---------- RESULT SCREEN ---------- */
  #result-capture{ display:flex; flex-direction:column; gap:26px; padding-bottom:6px; }
  .result-head{ margin-top:20px; }
  .result-head-flex{ display:flex; align-items:flex-start; gap:14px; }
  .result-head-text{ flex:1; min-width:0; }
  .result-head h2{
    font-size:clamp(24px,7vw,30px);
    font-style:italic;
    font-weight:500;
    line-height:1.3;
    margin-top:12px;
  }
  .result-head p{
    color:var(--ink-dim);
    font-size:14.5px;
    line-height:1.7;
    margin-top:12px;
  }
  .keywords{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .keyword-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--gold-ink);
    background:rgba(217,164,65,0.14);
    border:1px solid rgba(217,164,65,0.45);
    border-radius:999px;
    padding:5px 12px;
  }

  .sprite-frame{
    width:96px;
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    animation:bob 1.6s ease-in-out infinite;
  }
  .sprite-frame img{ width:100%; height:auto; image-rendering:pixelated; display:block; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @media (prefers-reduced-motion: reduce){ .sprite-frame{ animation:none; } }

  .radar-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .radar-wrap .cap{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:6px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--line); }

  .coffee-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:var(--shadow);
    min-width:0;
  }
  .coffee-card .rank{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--adventure);
  }
  .coffee-card h3{
    font-size:15px;
    line-height:1.35;
    font-weight:600;
  }
  .coffee-card .name-en{
    color:var(--ink-dim);
    font-size:10.5px;
    margin-top:2px;
    font-family:'IBM Plex Mono',monospace;
    overflow-wrap:break-word;
  }
  .coffee-meta{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:11.5px;
    color:var(--ink-dim);
  }
  .coffee-meta span b{ color:var(--ink); font-weight:600; }
  .cupnotes{ display:flex; flex-wrap:wrap; gap:5px; }
  .cupnote-chip{
    font-size:10.5px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 8px;
    color:var(--ink);
  }
  .coffee-body{ display:flex; align-items:center; justify-content:center; margin-top:auto; padding-top:8px; }
  .coffee-body svg{ flex-shrink:0; max-width:100%; height:auto; }

  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }

  .footnote{
    text-align:center;
    color:var(--ink-dim);
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    margin-top:8px;
    opacity:0.7;
  }
</style>
</head>
<body>
<div class="frame" id="frame">

  <!-- ================= START ================= -->
  <section class="screen active" id="screen-start">
    <div class="start-top">
      <svg class="compass-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.4" stroke="currentColor" stroke-width="1.4"/>
        <path d="M15.2 8.8 13 13l-4.2 2.2L11 11l4.2-2.2Z" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
      </svg>
      <div class="eyebrow">Coffee Expedition · 입단 테스트</div>
      <h1>커피 원정대에<br>오신 것을<br>환영합니다</h1>
      <p>당신의 미각을 단서 삼아<br>가장 잘 맞는 커피를 찾아가는 여정을 떠나보세요.</p>
      <div class="start-meta">
        <div><b>13</b>질문</div>
        <div><b>~2분</b>소요시간</div>
      </div>
    </div>
    <div>
      <button class="btn-primary" id="btn-start">원정 시작하기</button>
    </div>
  </section>

  <!-- ================= SURVEY ================= -->
  <section class="screen" id="screen-survey">
    <div class="survey-top">
      <button class="back-btn" id="btn-back" disabled>‹</button>
      <div class="roast-gauge"><div class="mask" id="roast-mask" style="width:92%"></div></div>
      <div class="q-count" id="q-count">1 / 12</div>
    </div>
    <div class="q-card">
      <div class="q-text" id="q-text">첫 모금을 마셨을 때 산뜻한 느낌의 커피를 좋아한다.</div>
      <div class="options" id="options"></div>
    </div>
  </section>

  <!-- ================= LOADING ================= -->
  <section class="screen" id="screen-loading">
    <svg class="brew-spinner" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="#a9701d" stroke-width="2" stroke-dasharray="42 14" stroke-linecap="round"/>
    </svg>
    <p>미각 지도를 그리는 중...</p>
  </section>

  <!-- ================= RESULT ================= -->
  <section class="screen" id="screen-result">
    <div id="result-capture">
      <div class="survey-top" style="margin-bottom:-8px;">
        <button class="back-btn" id="btn-back-result">‹</button>
        <div class="q-count" style="margin-left:auto;">RESULT</div>
      </div>

      <div class="result-head">
        <div class="result-head-flex">
          <div class="result-head-text">
            <div class="eyebrow">나의 커피 취향은</div>
            <h2 id="type-title">-</h2>
            <p id="type-desc">-</p>
            <div class="keywords" id="type-keywords"></div>
          </div>
          <div class="sprite-frame">
            <img id="sprite-img" src="" alt="원정대 캐릭터">
          </div>
        </div>
      </div>

      <div>
        <div class="section-label">함께 떠날 원두 파트너</div>
      </div>
      <div id="coffee-list" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"></div>
    </div>

    <div class="result-actions">
      <button class="btn-primary" id="btn-save">탐험 카드 저장하기</button>
      <button class="btn-ghost" id="btn-restart">다시 원정 떠나기</button>
    </div>
    <div class="footnote">TASTE SCORE는 SCA 커핑 항목을 참고해 재구성한 자체 지표입니다</div>
  </section>

</div>

/* =========================================================
   STATE
========================================================= */
let current = 0;
const answers = new Array(questions.length).fill(null); // -2..2

const screens = {
  start: document.getElementById('screen-start'),
  survey: document.getElementById('screen-survey'),
  loading: document.getElementById('screen-loading'),
  result: document.getElementById('screen-result')
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* =========================================================
   SURVEY RENDER
========================================================= */
const OPTION_LABELS = [
  {v:-2, label:"전혀 아니다"},
  {v:-1, label:"조금 아니다"},
  {v:0,  label:"보통이다"},
  {v:1,  label:"조금 그렇다"},
  {v:2,  label:"매우 그렇다"}
];

const btnBack = document.getElementById('btn-back');
const qCount = document.getElementById('q-count');
const roastMask = document.getElementById('roast-mask');
const qText = document.getElementById('q-text');
const optionsEl = document.getElementById('options');

function renderQuestion(){
  const q = questions[current];
  qText.textContent = q.question;
  qCount.textContent = `${current+1} / ${questions.length}`;
  btnBack.disabled = current === 0;

  const progressRatio = (current) / questions.length; // fill decreases mask width from right
  roastMask.style.width = `${(1-progressRatio)*100}%`;

  optionsEl.innerHTML = '';
  OPTION_LABELS.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[current]===opt.v ? ' selected' : '');
    btn.innerHTML = `<span class="dot"></span><span>${opt.label}</span>`;
    btn.addEventListener('click', ()=> selectAnswer(opt.v));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(value){
  answers[current] = value;
  renderQuestion();
  setTimeout(()=>{
    if(current < questions.length - 1){
      current++;
      renderQuestion();
    } else {
      goCalculate();
    }
  }, 260);
}

document.getElementById('btn-start').addEventListener('click', ()=>{
  current = 0;
  showScreen('survey');
  renderQuestion();
});

btnBack.addEventListener('click', ()=>{
  if(current > 0){
    current--;
    renderQuestion();
  }
});

document.getElementById('btn-back-result').addEventListener('click', ()=>{
  current = questions.length - 1;
  showScreen('survey');
  renderQuestion();
});

document.getElementById('btn-restart').addEventListener('click', ()=>{
  if(spriteTimer) clearInterval(spriteTimer);
  answers.fill(null);
  current = 0;
  showScreen('start');
});

/* =========================================================
   SCORING
========================================================= */
function computeUserVector(){
  const vec = {}; TRAITS.forEach(t=>vec[t]=0);
  answers.forEach((val, i)=>{
    if(val===null) return;
    if(questions[i].preference) return; // preference-only questions (e.g. decaf) don't affect taste
    const eff = questions[i].effect;
    TRAITS.forEach(t=>{ vec[t] += val * (eff[t]||0); });
  });
  return vec;
}

function computeDecafPreference(){
  const qIndex = questions.findIndex(q=> q.preference === 'decaf');
  if(qIndex === -1) return null;
  const val = answers[qIndex];
  if(val === null) return null;
  if(val >= 1) return true;   // 조금 그렇다 / 매우 그렇다
  if(val <= -1) return false; // 조금 아니다 / 전혀 아니다
  return null;                // 보통이다 -> 선호 없음
}

function cosineSim(a, b){
  let dot=0, na=0, nb=0;
  TRAITS.forEach(t=>{
    dot += (a[t]||0)*(b[t]||0);
    na += (a[t]||0)**2;
    nb += (b[t]||0)**2;
  });
  if(na===0 || nb===0) return -Infinity;
  return dot / (Math.sqrt(na)*Math.sqrt(nb));
}

function matchType(userVec){
  let best=null, bestScore=-Infinity;
  types.forEach(t=>{
    const s = cosineSim(userVec, t.center_score);
    if(s > bestScore){ bestScore=s; best=t; }
  });
  return best;
}

function pickDiverseSecond(scored, first){
  const rest = scored.filter(c=> c.id !== first.id);
  let bestSecond=null, bestScore=-Infinity;
  rest.slice(0, 10).forEach(c=>{
    const overlap = c.cup_notes.filter(n=> first.cup_notes.includes(n)).length;
    const diversityBonus = (c.country_en !== first.country_en ? 0.06 : 0) + (c.process !== first.process ? 0.03 : 0);
    const score = c.similarity - overlap*0.035 + diversityBonus;
    if(score > bestScore){ bestScore=score; bestSecond=c; }
  });
  return bestSecond;
}

function recommendCoffees(userVec, decafPref){
  const scored = coffees.map(c=>({...c, similarity: cosineSim(userVec, c.taste_score)}));
  scored.sort((a,b)=> b.similarity - a.similarity);

  const first = scored[0];

  if(decafPref === true){
    // 디카페인 선호: 추천 2종 중 반드시 1개는 decaf 원두로 보장
    if(first.decaf){
      const second = pickDiverseSecond(scored, first);
      return [first, second];
    }
    const bestDecaf = scored.filter(c=> c.decaf).sort((a,b)=> b.similarity - a.similarity)[0];
    return [first, bestDecaf || pickDiverseSecond(scored, first)];
  }

  const second = pickDiverseSecond(scored, first);
  return [first, second];
}

========================================================= */
function radarSVG(axes, values, opts={}){
  // axes: [{key,label}], values: {key:0..max}
  const size = opts.size || 220;
  const max = opts.max || 5;
  const cx = size/2, cy = size/2;
  const r = size/2 - (opts.pad || 34);
  const n = axes.length;
  const angle = (i)=> (Math.PI*2 * i/n) - Math.PI/2;

  const pointAt = (i, ratio)=>{
    const a = angle(i);
    return [cx + Math.cos(a)*r*ratio, cy + Math.sin(a)*r*ratio];
  };

  // rings
  let rings = '';
  [0.25,0.5,0.75,1].forEach(ratio=>{
    const pts = axes.map((_,i)=> pointAt(i, ratio).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(46,32,19,0.14)" stroke-width="1"/>`;
  });

  // axis lines + labels
  let axesLines = '', labels = '';
  axes.forEach((ax, i)=>{
    const [x,y] = pointAt(i, 1);
    axesLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(46,32,19,0.16)" stroke-width="1"/>`;
    const [lx,ly] = pointAt(i, 1.16);
    labels += `<text x="${lx}" y="${ly}" fill="#6d7c5f" font-size="10.5" font-family="IBM Plex Mono, monospace" text-anchor="middle" dominant-baseline="middle">${ax.label}</text>`;
  });

  // data polygon
  const dataPts = axes.map((ax,i)=> pointAt(i, Math.min(values[ax.key],max)/max).join(',')).join(' ');

  return `
  <svg viewBox="0 0 ${size} ${size}" width="${opts.width || size}" height="${opts.width || size}">
    ${rings}
    ${axesLines}
    <polygon points="${dataPts}" fill="rgba(63,125,74,0.28)" stroke="#3f7d4a" stroke-width="2" stroke-linejoin="round"/>
    ${labels}
  </svg>`;
}

const MAIN_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'body', label:'바디'},
  {key:'bitterness', label:'쓴맛'},
  {key:'fruit', label:'과일'},
  {key:'floral', label:'플로럴'},
  {key:'unique', label:'개성'},
  {key:'nutty', label:'고소함'},
  {key:'chocolate', label:'초콜릿'}
];
const MINI_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'bitterness', label:'쓴맛'},
  {key:'body', label:'바디'}
];

/* =========================================================
   CHARACTER SPRITE ANIMATION
========================================================= */
let spriteTimer = null;
function renderSprite(typeId){
  const frames = SPRITES[typeId];
  const img = document.getElementById('sprite-img');
  if(!frames || !img) return;
  let idx = 0;
  img.src = frames[idx];
  if(spriteTimer) clearInterval(spriteTimer);
  spriteTimer = setInterval(()=>{
    idx = (idx + 1) % frames.length;
    img.src = frames[idx];
  }, 450);
}

/* =========================================================
   RESULT RENDER
========================================================= */
function goCalculate(){
  showScreen('loading');
  setTimeout(()=>{
    const userVec = computeUserVector();
    const matchedType = matchType(userVec);
    const decafPref = computeDecafPreference();
    const [c1, c2] = recommendCoffees(userVec, decafPref);
    renderResult(matchedType, c1, c2);
    showScreen('result');
  }, 700);
}

function renderResult(type, c1, c2){
  document.getElementById('type-title').textContent = type.title;
  document.getElementById('type-desc').textContent = type.description;
  const kw = document.getElementById('type-keywords');
  kw.innerHTML = '';
  type.keywords.forEach(k=>{
    const chip = document.createElement('span');
    chip.className = 'keyword-chip';
    chip.textContent = `#${k}`;
    kw.appendChild(chip);
  });

  renderSprite(type.id);

  const list = document.getElementById('coffee-list');
  list.innerHTML = '';
  [c1, c2].forEach((c, idx)=>{
    if(!c) return;
    const card = document.createElement('div');
    card.className = 'coffee-card';
    card.innerHTML = `
      <div class="rank">RECOMMENDED 0${idx+1}</div>
      <div>
        <h3>${c.name_ko}</h3>
        <div class="name-en">${c.name_en}</div>
      </div>
      <div class="coffee-meta">
        <span>원산지 <b>${c.country_ko}</b></span>
        <span>가공 <b>${c.process}</b></span>
        ${c.decaf ? '<span>카페인 <b>디카페인</b></span>' : ''}
      </div>
      <div class="cupnotes">${c.cup_notes.map(n=>`<span class="cupnote-chip">${n}</span>`).join('')}</div>
      <div class="coffee-body"></div>
    `;
    card.querySelector('.coffee-body').innerHTML = radarSVG(MINI_AXES, c.taste_score, {size:150, width:118, pad:26});
    list.appendChild(card);
  });
}

/* =========================================================
   SAVE AS IMAGE
========================================================= */
document.getElementById('btn-save').addEventListener('click', ()=>{
  const target = document.getElementById('result-capture');
  html2canvas(target, {backgroundColor:'#eef3e2', scale:2}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'coffee-flavor-profile.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});
