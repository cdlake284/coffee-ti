<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>커피 원정대 | Coffee Expedition</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#eef3e2;
    --bg-vignette:#e3ecd2;
    --surface:#fbfdf6;
    --surface-2:#eef2df;
    --ink:#26331f;
    --ink-dim:#6d7c5f;
    --adventure:#3f7d4a;
    --forest:#2c5c37;
    --sky:#5c8aa0;
    --gold:#d9a441;
    --gold-ink:#a9701d;
    --on-accent:#fbfdf6;
    --line:rgba(38,51,31,0.14);
    --line-strong:rgba(38,51,31,0.30);
    --radius:20px;
    --radius-sm:12px;
    --shadow:0 16px 34px rgba(50,74,40,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 6%, rgba(92,138,160,0.16), transparent 42%),
      radial-gradient(circle at 90% 94%, rgba(63,125,74,0.20), transparent 46%),
      var(--bg-vignette);
    color:var(--ink);
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    padding:28px 22px 40px;
    display:flex;
    flex-direction:column;
  }
  /* decorative compass rings, like a well-worn treasure map */
  .frame::before, .frame::after{
    content:"";
    position:absolute;
    border-radius:50%;
    border:1.5px dashed rgba(63,125,74,0.30);
    pointer-events:none;
  }
  

  .eyebrow{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  h1,h2,h3{ font-family:'Pretendard Variable', Pretendard, sans-serif; margin:0; font-weight:600; }

  .screen{ display:none; flex-direction:column; flex:1; animation:fade .45s ease both; }
  .screen.active{ display:flex; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---------- START SCREEN ---------- */
  #screen-start{ justify-content:space-between; position:relative; overflow:hidden; }
  #screen-start::after{
    content:"";
    position:absolute;
    left:-22px; right:-22px; bottom:-40px;
    height:92%;
    background:url('images/background/cover.png') center bottom / cover no-repeat;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.55) 20%, #000 40%);
    mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.55) 20%, #000 40%);
    z-index:0;
  }
  .start-top{ position:relative; z-index:1; margin-top:30px; text-align:center; }
  .start-cta{
    position:relative;
    z-index:1;
    margin-top:auto;
    margin-bottom:32px;
  }

  .compass-badge{
    width:52px; height:52px;
    border-radius:50%;
    background:linear-gradient(155deg, rgba(251,253,246,0.95), rgba(251,253,246,0.75));
    border:1.5px solid rgba(169,112,29,0.35);
    box-shadow:0 8px 18px rgba(50,74,40,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .compass-icon{ width:26px; height:26px; color:var(--gold-ink); }

  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  .eyebrow-row .eyebrow{
    letter-spacing:0.22em;
    font-weight:600;
    white-space:nowrap;
  }
  .eyebrow-line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(169,112,29,0.45), rgba(169,112,29,0));
  }

  .headline-cloud{
    position:relative;
    margin-top:26px;
    display:inline-block;
    max-width:100%;
    text-align:left;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:32px;
    padding:26px 26px 24px;
    box-shadow:0 22px 40px rgba(92,138,160,0.20), 0 4px 10px rgba(92,138,160,0.10);
    animation:cloud-float 6s ease-in-out infinite;
  }
  @keyframes cloud-float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
  }
  @media (prefers-reduced-motion: reduce){ .headline-cloud{ animation:none; } }

  .start-top h1{
    font-size:clamp(24px,6.6vw,32px);
    line-height:1.32;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--forest);
  }
  .start-top p{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.65;
    margin-top:14px;
  }
  .start-meta{
    display:flex;
    gap:18px;
    margin-top:28px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .start-meta div{ display:flex; flex-direction:column; gap:4px; }
  .start-meta b{ color:var(--ink); font-size:18px; font-weight:700; }

  .btn-primary{
    background:linear-gradient(120deg,#3f7d4a 0%,#3f7d4a 45%,#c9862f 100%);
    color:var(--on-accent);
    border:none;
    border-radius:999px;
    padding:17px 22px;
    font-size:16px;
    font-weight:600;
    width:100%;
    cursor:pointer;
    box-shadow:0 14px 28px rgba(63,125,74,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
    transition:transform .15s ease, box-shadow .15s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary:active{ transform:scale(0.98); box-shadow:0 6px 14px rgba(63,125,74,0.26); }
  .btn-arrow{ width:18px; height:18px; flex-shrink:0; transition:transform .15s ease; }
  .btn-primary:active .btn-arrow{ transform:translateX(3px); }

  .btn-ghost{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:14px 18px;
    font-size:14px;
    font-weight:500;
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    width:100%;
    cursor:pointer;
    margin-top:10px;
  }

  /* ---------- SURVEY SCREEN ---------- */
  .survey-top{
    display:flex; align-items:center; gap:12px;
    background:rgba(251,253,246,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:999px;
    padding:6px 10px 6px 6px;
    margin-bottom:8px;
  }
  .survey-top .q-count{ color:var(--ink); font-weight:500; }
  .back-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:18px;
  }
  .back-btn:disabled{ opacity:0.3; cursor:default; }

  .roast-gauge{
    flex:1;
    height:10px;
    border-radius:999px;
    background:linear-gradient(90deg,#cfe3b8,#8fbf98,#6f93a9,#3f5a63);
    background-size:400% 100%;

    overflow:hidden;
    border:1px solid var(--line);
  }
  .roast-gauge .mask{

  .q-count{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    white-space:nowrap;
  }

  #screen-survey{
  position:relative;
}
  #screen-survey .survey-top{ position:relative; z-index:1; }
  .q-body{
    position:relative;
    z-index:1;
    flex:1;
    padding-top:24px;
    padding-bottom:24px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  margin-top:14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Pretendard Variable', Pretendard, sans-serif;
  font-size:12.5px;

}

    line-height:1;
  }
  .q-box{
  background:rgba(255,255,255,1);
  border:1px solid rgba(255,255,255,0.55);
  border-radius:16px;
  padding:18px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,0.06);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
  .q-text{
    font-size:clamp(19px,5.4vw,22px);
    line-height:1.5;
    font-weight:600;
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    color:#111;
  }
  .scale-box{
    margin-top:26px;
    background:rgba(255,255,255,1);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:16px;
    padding:26px 18px 18px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    box-shadow:0 8px 24px rgba(0,0,0,0.06);
    backdrop-filter:blur(6px);

  .title-row{ display:flex; align-items:center; gap:28px; }
  .result-head h2{
    font-size:clamp(24px,7vw,30px);
    font-style:italic;
    font-weight:500;
    line-height:1.3;
    margin-top:12px;

    color:var(--ink-dim);
    font-size:14.5px;
    line-height:1.7;
    margin-top:12px;
  }

  .keyword-chip{
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    font-size:11.5px;
    color:var(--gold-ink);
    background:rgba(217,164,65,0.14);
    border:1px solid rgba(217,164,65,0.45);
    border-radius:999px;
    padding:5px 12px;

    height:auto;
    flex-shrink:0;
    image-rendering:pixelated;
    display:block;

    border:1px solid var(--line);
    border-radius:var(--radius);

    flex-direction:column;
    align-items:center;

    color:var(--ink-dim);

    margin-bottom:6px;

    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:10px;
  }

    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);

    flex-direction:column;
    gap:10px;

    line-height:1.35;
    font-weight:600;

  .coffee-meta{
    display:flex;
    flex-direction:column;

  .coffee-meta span b{ color:var(--ink); font-weight:600; }
  .cupnotes{ display:flex; flex-wrap:wrap; gap:5px; }

</style>

/* =========================================================

const TRAITS = ["fruit","floral","nutty","chocolate","unique","acidity","sweetness","body","bitterness"];

const MICRO_PROGRESS = [
  "오두막을 나서는 중...",
  "들판을 가로지르는 중...",
  "꽃이 흐드러진 길을 걷는 중...",

  "별이 뜬 밤을 지나는 중...",
  "마을의 불빛을 발견한 중...",
  "마을로 내려가는 중...",
  "식당 냄새를 맡는 중...",
  "마지막 선택을 앞둔 중..."
];

let questions = [];
let types = [];
let coffees = [];

/* Robustly parse a text file that may contain multiple
   concatenated top-level JSON values (e.g. an array followed
   by a stray trailing object), flattening arrays into one list. */
function parseConcatenatedJSON(text){
  const values = [];
  const s = text;
  const len = s.length;
  let i = 0;
  while(i < len){
    while(i < len && /\s/.test(s[i])) i++;
    if(i >= len) break;
    const start = i;
    let depth = 0, inStr = false, esc = false;
    for(; i < len; i++){
      const c = s[i];
      if(inStr){
        if(esc){ esc = false; }
        else if(c === '\\'){ esc = true; }
        else if(c === '"'){ inStr = false; }
        continue;
      }
      if(c === '"'){ inStr = true; continue; }
      if(c === '[' || c === '{'){ depth++; }
      else if(c === ']' || c === '}'){
        depth--;
        if(depth === 0){ i++; break; }
      }
    }
    const chunk = s.slice(start, i).trim();
    if(!chunk) break;
    values.push(JSON.parse(chunk));
  }
  return values;
}

function flattenJSONValues(values){
  let result = [];
  values.forEach(v=>{
    if(Array.isArray(v)) result = result.concat(v);
    else result.push(v);
  });
  return result;
}

async function fetchJSONFlexible(url){
  const res = await fetch(url);
  const text = await res.text();
  try{
    return JSON.parse(text);
  }catch(e){
    return flattenJSONValues(parseConcatenatedJSON(text));
  }
}

async function loadData(){
  const [q, t, c] = await Promise.all([
    fetchJSONFlexible('data/questions.json'),
    fetchJSONFlexible('data/type.json'),
    fetchJSONFlexible('data/coffee.json')
  ]);
  questions = q;
  types = t;
  coffees = c;
}

/* =========================================================
   STATE
========================================================= */
let current = 0;
let answers = []; // -2..2, sized once questions.json loads

const screens = {
  start: document.getElementById('screen-start'),
  survey: document.getElementById('screen-survey'),
  loading: document.getElementById('screen-loading'),
  result: document.getElementById('screen-result')
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* =========================================================
   SURVEY RENDER
========================================================= */
const OPTION_LABELS = [
  {v:-2, label:"전혀 아니다"},
  {v:-1, label:"조금 아니다"},
  {v:0,  label:"보통이다"},
  {v:1,  label:"조금 그렇다"},
  {v:2,  label:"매우 그렇다"}
];

const btnBack = document.getElementById('btn-back');
const qCount = document.getElementById('q-count');
const roastMask = document.getElementById('roast-mask');
const qText = document.getElementById('q-text');
const progressNote = document.getElementById('progress-note');

const optionsEl = document.getElementById('options');

function renderQuestion(){
  const q = questions[current];
  qText.textContent = "Q. " + q.question;
  qCount.textContent = `${current+1} / ${questions.length}`;
  btnBack.disabled = current === 0;

  if(progressNote){
    progressNote.textContent = MICRO_PROGRESS[current] || "탐험을 진행하는 중...";
  }

  const progressRatio = (current) / questions.length; // fill decreases mask width from right
  roastMask.style.width = `${(1-progressRatio)*100}%`;

  optionsEl.innerHTML = '';
  OPTION_LABELS.forEach(opt=>{
    const btn = document.createElement('button');
    const isSelected = answers[current] === opt.v;
    const size = scaleSizeForValue(opt.v);
    const color = scaleColorForValue(opt.v);
    btn.className = 'circle-btn' + (isSelected ? ' selected' : '');
    btn.style.width = size + 'px';
    btn.style.height = size + 'px';
    btn.style.borderColor = color;
    if(isSelected){ btn.style.background = color; }
    btn.setAttribute('aria-label', opt.label);
    btn.title = opt.label;
    btn.addEventListener('click', ()=> selectAnswer(opt.v));
    optionsEl.appendChild(btn);
  });
}

// -2(아니다, 빨강) ~ +2(그렇다, 초록) 로 갈수록 테두리/채움 색이 점점 초록에 가까워집니다.
function scaleColorForValue(v){
  const t = (v + 2) / 4; // 0..1
  const from = [199, 74, 34];  // 아니다 쪽 (레드/오렌지)
  const to   = [63, 125, 74];  // 그렇다 쪽 (그린)
  const r = Math.round(from[0] + (to[0]-from[0]) * t);
  const g = Math.round(from[1] + (to[1]-from[1]) * t);
  const b = Math.round(from[2] + (to[2]-from[2]) * t);
  return `rgb(${r},${g},${b})`;
}

// 양 끝(강한 의견)은 크게, 가운데(보통)는 작게 표시됩니다.
function scaleSizeForValue(v){
  const sizeMap = { '-2':36, '-1':29, '0':22, '1':29, '2':36 };
  return sizeMap[String(v)] || 28;
}

function selectAnswer(value){
  answers[current] = value;
  renderQuestion();
  setTimeout(()=>{
    if(current < questions.length - 1){
      current++;
      renderQuestion();
    } else {
      goCalculate();
    }
  }, 260);
}

const btnStartEl = document.getElementById('btn-start');
const btnStartLabel = btnStartEl.querySelector('span');
const startMetaCount = document.querySelector('.start-meta b');
btnStartEl.disabled = true;
const btnStartOriginalText = btnStartLabel.textContent;
btnStartLabel.textContent = '불러오는 중...';

loadData().then(()=>{
  answers = new Array(questions.length).fill(null);
  if(startMetaCount) startMetaCount.textContent = questions.length;
  btnStartEl.disabled = false;
  btnStartLabel.textContent = btnStartOriginalText;
}).catch(err=>{
  console.error('데이터를 불러오지 못했습니다', err);
  btnStartLabel.textContent = '데이터 로드 실패 - 새로고침 해주세요';
});

document.getElementById('btn-start').addEventListener('click', ()=>{
  if(!questions.length) return;
  current = 0;
  showScreen('survey');
  renderQuestion();
});

btnBack.addEventListener('click', ()=>{
  if(current > 0){
    current--;
    renderQuestion();
  }
});

document.getElementById('btn-back-result').addEventListener('click', ()=>{
  current = questions.length - 1;
  showScreen('survey');
  renderQuestion();
});

document.getElementById('btn-restart').addEventListener('click', ()=>{
  if(spriteTimer) clearInterval(spriteTimer);
  answers.fill(null);
  current = 0;
  showScreen('start');
});

/* =========================================================
   SCORING
========================================================= */
function computeUserVector(){
  const vec = {}; TRAITS.forEach(t=>vec[t]=0);
  answers.forEach((val, i)=>{
    if(val===null) return;
    if(questions[i].preference) return; // preference-only questions (e.g. decaf) don't affect taste
    const eff = questions[i].effect;
    TRAITS.forEach(t=>{ vec[t] += val * (eff[t]||0); });
  });
  return vec;
}
function isZeroVector(vec){
  return TRAITS.every(t => (vec[t] || 0) === 0);
}
  
function computeDecafPreference(){
  const qIndex = questions.findIndex(q=>{
    if(!q.preference) return false;
    if(typeof q.preference === 'string') return q.preference === 'decaf';
    return q.preference.key === 'decaf';
  });
  if(qIndex === -1) return null;
  const val = answers[qIndex];
  if(val === null) return null;
  if(val >= 1) return true;   // 조금 그렇다 / 매우 그렇다
  if(val <= -1) return false; // 조금 아니다 / 전혀 아니다
  return null;                // 보통이다 -> 선호 없음
}

function cosineSim(a, b){
  let dot=0, na=0, nb=0;
  TRAITS.forEach(t=>{
    dot += (a[t]||0)*(b[t]||0);
    na += (a[t]||0)**2;
    nb += (b[t]||0)**2;
  });
  if(na===0 || nb===0) return -Infinity;
  return dot / (Math.sqrt(na)*Math.sqrt(nb));
}

function matchType(userVec){
  let best=null, bestScore=-Infinity;
  types.forEach(t=>{
    const s = cosineSim(userVec, t.center_score);
    if(s > bestScore){ bestScore=s; best=t; }
  });
  return best;
}

function pickDiverseSecond(scored, first){
  const rest = scored.filter(c=> c.id !== first.id);
  let bestSecond=null, bestScore=-Infinity;
  rest.slice(0, 10).forEach(c=>{
    const overlap = c.cup_notes.filter(n=> first.cup_notes.includes(n)).length;
    const diversityBonus = (c.country_en !== first.country_en ? 0.06 : 0) + (c.process !== first.process ? 0.03 : 0);
    const score = c.similarity - overlap*0.035 + diversityBonus;
    if(score > bestScore){ bestScore=score; bestSecond=c; }
  });
  return bestSecond;
}

function recommendCoffees(userVec, decafPref){
  // 디카페인을 명시적으로 원하는 경우(true)가 아니면, 디카페인 원두는 후보에서 아예 제외한다.
  // (그렇지 않으면 바디감/쌉싸름함이 강한 취향일 때 카페인 원두를 원하는 사용자에게도
  //  맛 프로필만 보고 디카페인 원두가 1순위로 추천되는 문제가 있었음)
  const basePool = decafPref === true ? coffees : coffees.filter(c=> !c.decaf);

  const scored = basePool.map(c=>({...c, similarity: cosineSim(userVec, c.taste_score)}));
  scored.sort((a,b)=> b.similarity - a.similarity);

  const first = scored[0];

  if(decafPref === true){
    // 디카페인 선호: 추천 2종 중 반드시 1개는 decaf 원두로 보장
    if(first.decaf){
      const second = pickDiverseSecond(scored, first);
      return [first, second];
    }
    const bestDecaf = scored.filter(c=> c.decaf).sort((a,b)=> b.similarity - a.similarity)[0];
    return [first, bestDecaf || pickDiverseSecond(scored, first)];
  }

  const second = pickDiverseSecond(scored, first);
  return [first, second];
}

/* =========================================================
   RADAR CHART (SVG)
========================================================= */
function radarSVG(axes, values, opts={}){
  // axes: [{key,label}], values: {key:0..max}
  const size = opts.size || 220;
  const max = opts.max || 5;
  const cx = size/2, cy = size/2;
  const r = size/2 - (opts.pad || 34);
  const n = axes.length;
  const angle = (i)=> (Math.PI*2 * i/n) - Math.PI/2;

  const pointAt = (i, ratio)=>{
    const a = angle(i);
    return [cx + Math.cos(a)*r*ratio, cy + Math.sin(a)*r*ratio];
  };

  // rings
  let rings = '';
  [0.25,0.5,0.75,1].forEach(ratio=>{
    const pts = axes.map((_,i)=> pointAt(i, ratio).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(46,32,19,0.14)" stroke-width="1"/>`;
  });

  // axis lines + labels
  let axesLines = '', labels = '';
  axes.forEach((ax, i)=>{
    const [x,y] = pointAt(i, 1);
    axesLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(46,32,19,0.16)" stroke-width="1"/>`;
    const [lx,ly] = pointAt(i, 1.16);
    labels += `<text x="${lx}" y="${ly}" fill="#6d7c5f" font-size="10.5" font-family="Pretendard Variable, Pretendard, sans-serif" text-anchor="middle" dominant-baseline="middle">${ax.label}</text>`;
  });

  // data polygon
  const dataPts = axes.map((ax,i)=> pointAt(i, Math.min(values[ax.key],max)/max).join(',')).join(' ');

  return `
  <svg viewBox="0 0 ${size} ${size}" width="${opts.width || size}" height="${opts.width || size}">
    ${rings}
    ${axesLines}
    <polygon points="${dataPts}" fill="rgba(63,125,74,0.28)" stroke="#3f7d4a" stroke-width="2" stroke-linejoin="round"/>
    ${labels}
  </svg>`;
}

const MAIN_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'body', label:'바디'},
  {key:'bitterness', label:'쓴맛'},
  {key:'fruit', label:'과일'},
  {key:'floral', label:'플로럴'},
  {key:'unique', label:'개성'},
  {key:'nutty', label:'고소함'},
  {key:'chocolate', label:'초콜릿'}
];
const MINI_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'bitterness', label:'쓴맛'},
  {key:'body', label:'바디'}
];

/* =========================================================
   CHARACTER SPRITE ANIMATION
========================================================= */
let spriteTimer = null;
function renderSprite(typeId){
  const frames = [
    `images/characters/${typeId}_idle.png`,
    `images/characters/${typeId}_pose1.png`,
    `images/characters/${typeId}_pose2.png`
  ];
  const img = document.getElementById('sprite-img');
  if(!img) return;
  let idx = 0;
  img.src = frames[idx];
  if(spriteTimer) clearInterval(spriteTimer);
  spriteTimer = setInterval(()=>{
    idx = (idx + 1) % frames.length;
    img.src = frames[idx];
  }, 450);
}

/* =========================================================
   RESULT RENDER
========================================================= */
function goCalculate(){
  showScreen('loading');
  setTimeout(()=>{
    let userVec = computeUserVector();
const decafPref = computeDecafPreference();

let matchedType;

if (isZeroVector(userVec)) {

    matchedType = types.find(t => t.id === "I");

    // 여행자 타입의 기준점으로 userVec을 변경
    userVec = { ...matchedType.center_score };

} else {

    matchedType = matchType(userVec);

}

const [c1, c2] = recommendCoffees(userVec, decafPref);
    renderResult(matchedType, c1, c2);
    showScreen('result');
  }, 700);
}

function renderResult(type, c1, c2){
  document.getElementById('type-title').textContent = type.title;
  document.getElementById('type-desc').textContent = type.description;
  const kw = document.getElementById('type-keywords');
  kw.innerHTML = '';
  type.keywords.forEach(k=>{
    const chip = document.createElement('span');
    chip.className = 'keyword-chip';
    chip.textContent = `#${k}`;
    kw.appendChild(chip);
  });

  renderSprite(type.id);

  const list = document.getElementById('coffee-list');
  list.innerHTML = '';
  [c1, c2].forEach((c, idx)=>{
    if(!c) return;
    const card = document.createElement('div');
    card.className = 'coffee-card';
    card.innerHTML = `
      <div class="rank">RECOMMENDED 0${idx+1}</div>
      <div>
        <h3>${c.name_ko}</h3>
        <div class="name-en">${c.name_en}</div>
      </div>
      <div class="coffee-meta">
        <span>원산지 <b>${c.country_ko}</b></span>
        <span>가공 <b>${c.process}</b></span>
        ${c.decaf ? '<span>카페인 <b>디카페인</b></span>' : ''}
      </div>
      <div class="cupnotes">${c.cup_notes.map(n=>`<span class="cupnote-chip">${n}</span>`).join('')}</div>
      <div class="coffee-body"></div>
    `;
    card.querySelector('.coffee-body').innerHTML = radarSVG(MINI_AXES, c.taste_score, {size:150, width:118, pad:26});
    list.appendChild(card);
  });
}

/* =========================================================
   SAVE AS IMAGE
========================================================= */
document.getElementById('btn-save').addEventListener('click', ()=>{
  const target = document.getElementById('result-capture');
  html2canvas(target, {
    backgroundColor:'#eef3e2',
    scale:2,
    scrollX: 0,
    scrollY: -window.scrollY,
    windowWidth: document.documentElement.scrollWidth,
    windowHeight: document.documentElement.scrollHeight,
    useCORS: true
  }).then(canvas=>{
    canvas.toBlob(async (blob)=>{
      if(!blob) return;
      const file = new File([blob], 'coffee-flavor-profile.png', {type:'image/png'});

      // 모바일(iOS/Android): 네이티브 공유 시트로 "사진에 저장"까지 한번에
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({
            files:[file],
            title:'커피 취향 탐험 결과',
            text:'나의 커피 취향 탐험 카드'
          });
          return;
        }catch(err){
          if(err && err.name === 'AbortError') return; // 사용자가 공유 취소
          // 공유 실패 시 아래 다운로드 방식으로 대체
        }
      }

      // PC 등 Web Share 미지원 환경: 기존 파일 다운로드 방식
      const link = document.createElement('a');
      link.download = 'coffee-flavor-profile.png';
      link.href = URL.createObjectURL(blob);
      link.click();
      setTimeout(()=> URL.revokeObjectURL(link.href), 4000);
    }, 'image/png');
  });
});
