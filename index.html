<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --page:#ECEAE3;
    --bg:#F6F5F1;
    --surface:#FFFFFF;
    --surface-2:#E6E4DC;
    --ink:#1C1C1A;
    --ink-2:#4A4943;
    --muted:#6B6A64;
    --muted-2:#77756D;
    --line:#DAD8D0;
    --line-soft:#EEECE6;
    --line-btn:#C9C7BE;
    --accent:#2F5D46;
    --sans:'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
  }
  h1,h2,h3,p{ margin:0; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .frame{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    padding:28px 24px 32px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- 공통 ---------- */
  .screen{ display:none; flex-direction:column; flex:1; animation:fade .45s var(--ease) both; }
  .screen.active{ display:flex; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:16px;
    border-bottom:1px solid var(--ink);
  }
  .logo{ font-family:var(--mono); font-size:13px; font-weight:500; letter-spacing:.12em; }
  .topbar-meta{ font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.08em; }
  .kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--accent); }
  .section-label{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--muted); }

  .btn-primary{
    height:56px; width:100%;
    border:none; border-radius:0;
    background:var(--ink); color:var(--bg);
    font-size:15px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    transition:background .2s ease, transform .1s ease, opacity .2s ease;
  }
  .btn-primary:hover{ background:#000; }
  .btn-primary:active{ transform:scale(.99); }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-arrow{ width:20px; height:20px; transition:transform .2s var(--ease); }
  .btn-primary:hover .btn-arrow{ transform:translateX(3px); }

  .btn-secondary{
    height:48px; width:100%;
    border:1px solid var(--line-btn); border-radius:0;
    background:transparent; color:var(--ink);
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-secondary:hover{ border-color:var(--ink); background:var(--surface); }

  /* ---------- 시작 ---------- */
  .start-intro{ margin-top:56px; display:flex; flex-direction:column; gap:20px; }
  .start-title{
    font-size:clamp(28px, 8.4vw, 34px);
    line-height:1.34;
    font-weight:300;
    letter-spacing:-.03em;
  }
  .start-title strong{ font-weight:600; }
  .stat-row{
    margin-top:36px;
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .stat{ padding:16px 0; display:flex; flex-direction:column; gap:4px; }
  .stat + .stat{ border-left:1px solid var(--line); padding-left:16px; }
  .stat b{ font-family:var(--mono); font-size:20px; font-weight:400; }
  .stat span{ font-size:11px; color:var(--muted); }
  .cover{
    flex:1;
    min-height:200px;
    margin-top:24px;
    background:var(--surface-2);
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .cover img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(.55) contrast(.96) brightness(1.02);
  }
  .btn-start{ margin-top:24px; justify-content:space-between; padding:0 22px; }

  /* ---------- 질문 ---------- */
  .survey-top{ display:flex; align-items:center; gap:16px; }
  .icon-btn{
    width:44px; height:44px; flex-shrink:0;
    border:1px solid var(--line); border-radius:0;
    background:transparent; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .icon-btn:hover:not(:disabled){ border-color:var(--ink); }
  .icon-btn:disabled{ opacity:.3; cursor:default; }
  .progress{ flex:1; height:2px; background:var(--line); position:relative; overflow:hidden; }
  .progress-fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--accent); transition:width .45s var(--ease); }
  .q-count{ font-family:var(--mono); font-size:12px; white-space:nowrap; }
  .q-count span{ color:var(--muted-2); }

  .q-body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px; padding:40px 0; }
  .q-label{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); }
  .q-text{
    font-size:clamp(21px, 6.4vw, 25px);
    line-height:1.5;
    font-weight:400;
    letter-spacing:-.02em;

  .options{ display:flex; flex-direction:column; gap:8px; }
  .option{
    height:52px;
    border:1px solid var(--line); border-radius:0;

    padding:0 18px;
    font-size:14px; text-align:left;

  .loading-radar{ width:180px; height:180px; }
  .loading-radar .draw{ stroke-dasharray:900; animation:draw 1.6s ease-out infinite; }
  @keyframes draw{ from{ stroke-dashoffset:900; } to{ stroke-dashoffset:0; } }
  .loading-text{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .loading-text p{ font-size:14px; color:var(--muted); }

  /* ---------- 결과 ---------- */

  .type-block{ display:flex; flex-direction:column; gap:16px; }
  .type-row{ display:flex; gap:20px; align-items:flex-end; }
  .type-head{ flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  #type-title{ font-size:clamp(28px, 8.6vw, 34px); font-weight:600; letter-spacing:-.03em; line-height:1.2; }
  .char-frame{
    width:96px; height:96px; flex-shrink:0;
    border:1px solid var(--ink);
    background-color:var(--surface);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:11px 11px;
    display:flex; align-items:center; justify-content:center;
  }
  .sprite{ width:76px; height:76px; object-fit:contain; image-rendering:pixelated; display:block; }
  .type-desc{ font-size:14px; line-height:1.75; color:var(--ink-2); }
  .keywords{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12.5px; }
  .keywords .sep{ color:var(--line-btn); }

  .map-block{ padding-top:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  .section-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .legend{ display:flex; gap:14px; font-size:11px; color:var(--muted); }
  .legend > span{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .lg-me{ display:inline-block; width:16px; height:2px; background:var(--accent); }
  .lg-type{ display:inline-block; width:16px; height:0; border-top:1px dashed var(--ink); }
  .map-box{ background:var(--surface); border:1px solid var(--line); display:flex; justify-content:center; padding:12px 8px; }
  .map-box svg{ width:100%; max-width:320px; height:auto; display:block; }

  .beans-block{ display:flex; flex-direction:column; }
  .beans-block .section-label{ padding-bottom:12px; }
  .bean-list{ border-top:1px solid var(--ink); }
  .bean{ padding:18px 0; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .bean-top{ display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:12px; }
  .bean-rank{ color:var(--accent); }
  .bean-match b{ font-weight:500; }
  .bean-body{ display:flex; gap:12px; align-items:center; }
  .bean-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .bean-name{ font-size:16px; font-weight:600; line-height:1.4; }
  .bean-en{ font-size:11px; color:var(--muted-2); line-height:1.4; overflow-wrap:anywhere; }
  .bean-meta{ font-size:12px; color:var(--ink-2); line-height:1.6; margin-top:4px; }
  .bean-variety{ color:var(--muted); }
  .bean-notes{ font-size:12px; line-height:1.6; }
  .bean-chart{ flex-shrink:0; width:110px; }
  .bean-chart svg{ display:block; width:110px; height:auto; }

  .result-actions{ margin-top:auto; padding-top:32px; display:flex; flex-direction:column; gap:8px; }
  .btn-row{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }

  /* 결과 섹션 순차 등장 */
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
  #screen-result.active #result-view > *{ animation:rise .5s var(--ease) both; }
  #screen-result.active #result-view > *:nth-child(2){ animation-delay:.08s; }
  #screen-result.active #result-view > *:nth-child(3){ animation-delay:.16s; }
  #screen-result.active #result-view > *:nth-child(4){ animation-delay:.24s; }

  @media (prefers-reduced-motion: reduce){
    .screen, .q-anim, #screen-result.active #result-view > *{ animation:none !important; }
    .loading-radar .draw{ animation:none; stroke-dashoffset:0; }
    .progress-fill{ transition:none; }
  }
</style>
</head>

<script>
/* =========================================================
   DATA
========================================================= */
const TRAITS = ["fruit","floral","nutty","chocolate","unique","acidity","sweetness","body","bitterness"];

let questions = [];
let types = [];
let coffees = [];

/* Robustly parse a text file that may contain multiple
   concatenated top-level JSON values (e.g. an array followed
   by a stray trailing object), flattening arrays into one list. */
function parseConcatenatedJSON(text){
  const values = [];
  const s = text;
  const len = s.length;
  let i = 0;
  while(i < len){
    while(i < len && /\s/.test(s[i])) i++;
    if(i >= len) break;
    const start = i;
    let depth = 0, inStr = false, esc = false;
    for(; i < len; i++){
      const c = s[i];
      if(inStr){
        if(esc){ esc = false; }
        else if(c === '\\'){ esc = true; }
        else if(c === '"'){ inStr = false; }
        continue;
      }
      if(c === '"'){ inStr = true; continue; }
      if(c === '[' || c === '{'){ depth++; }
      else if(c === ']' || c === '}'){
        depth--;
        if(depth === 0){ i++; break; }
      }
    }
    const chunk = s.slice(start, i).trim();
    if(!chunk) break;
    values.push(JSON.parse(chunk));
  }
  return values;
}

function flattenJSONValues(values){
  let result = [];
  values.forEach(v=>{
    if(Array.isArray(v)) result = result.concat(v);
    else result.push(v);
  });
  return result;
}

async function fetchJSONFlexible(url){
  const res = await fetch(url);
  const text = await res.text();
  try{
    return JSON.parse(text);
  }catch(e){
    return flattenJSONValues(parseConcatenatedJSON(text));
  }
}

async function loadData(){
  const [q, t, c] = await Promise.all([
    fetchJSONFlexible('data/questions.json'),
    fetchJSONFlexible('data/type.json'),
    fetchJSONFlexible('data/coffee.json')
  ]);
  questions = q;
  types = t;
  coffees = c;
}

/* =========================================================
   HELPERS
========================================================= */
const pad2 = n => String(n).padStart(2, '0');
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
const COLORS = {
  bg:'#F6F5F1', surface:'#FFFFFF', ink:'#1C1C1A', ink2:'#4A4943', muted:'#6B6A64',
  line:'#DAD8D0', soft:'#EEECE6', accent:'#2F5D46'
};

/* =========================================================
   STATE
========================================================= */
let current = 0;
let answers = []; // -2..2, sized once questions.json loads
let currentResult = { typeId: null, c1Id: null, c2Id: null, vec: null };
let lastRender = null;   // { type, beans:[{coffee, match}], userVec }
let cardPromise = null;  // 저장용 카드 이미지(미리 생성)
let isSharedView = false;

const screens = {
  start: document.getElementById('screen-start'),
  survey: document.getElementById('screen-survey'),
  loading: document.getElementById('screen-loading'),
  result: document.getElementById('screen-result')
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo(0, 0);
}

/* =========================================================
   SURVEY RENDER
========================================================= */
const OPTION_LABELS = [
  {v:-2, label:"전혀 아니다"},
  {v:-1, label:"조금 아니다"},
  {v:0,  label:"보통이다"},
  {v:1,  label:"조금 그렇다"},
  {v:2,  label:"매우 그렇다"}
];
// 화면에는 "매우 그렇다"가 맨 위에 오도록 역순으로 표시
const OPTION_DISPLAY = [...OPTION_LABELS].reverse();

const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="1.4"/></svg>';

const btnBack = document.getElementById('btn-back');
const qCount = document.getElementById('q-count');
const qLabel = document.getElementById('q-label');
const qText = document.getElementById('q-text');
const qBody = document.getElementById('q-body');
const progressEl = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const optionsEl = document.getElementById('options');

function replayAnim(el){
  el.classList.remove('q-anim');
  void el.offsetWidth; // reflow로 애니메이션 재시작
  el.classList.add('q-anim');
}

function renderQuestion(animate = true){
  const q = questions[current];
  const total = questions.length;
  qText.textContent = q.question;
  const category = q.category ? ' · ' + String(q.category).replace(/-/g, ' · ') : '';
  qLabel.textContent = `QUESTION ${pad2(current+1)}${category}`;
  qCount.innerHTML = `${pad2(current+1)}<span> / ${pad2(total)}</span>`;
  btnBack.disabled = current === 0;

  const pct = Math.round(((current+1) / total) * 100);
  progressFill.style.width = pct + '%';
  progressEl.setAttribute('aria-valuenow', pct);

  optionsEl.innerHTML = '';
  OPTION_DISPLAY.forEach(opt=>{
    const btn = document.createElement('button');
    const isSelected = answers[current] === opt.v;
    btn.type = 'button';
    btn.className = 'option' + (isSelected ? ' selected' : '');
    btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
    btn.innerHTML = `<span>${opt.label}</span>${CHECK_SVG}`;
    btn.addEventListener('click', ()=> selectAnswer(opt.v));
    optionsEl.appendChild(btn);
  });

  if(animate){
    replayAnim(qBody);
    replayAnim(optionsEl);
  }
}

let advancing = false;
function selectAnswer(value){
  if(advancing) return;
  advancing = true;
  answers[current] = value;
  renderQuestion(false);
  setTimeout(()=>{
    advancing = false;
    if(current < questions.length - 1){
      current++;
      renderQuestion(true);
    } else {
      goCalculate();
    }
  }, 260);
}

/* =========================================================
   SCORING
========================================================= */
function computeUserVector(){
  const vec = {}; TRAITS.forEach(t=>vec[t]=0);
  answers.forEach((val, i)=>{
    if(val===null) return;
    if(questions[i].preference) return; // preference-only questions (e.g. decaf) don't affect taste
    const eff = questions[i].effect;
    TRAITS.forEach(t=>{ vec[t] += val * (eff[t]||0); });
  });
  return vec;
}
function isZeroVector(vec){
  return TRAITS.every(t => (vec[t] || 0) === 0);
}

function computeDecafPreference(){
  const qIndex = questions.findIndex(q=>{
    if(!q.preference) return false;
    if(typeof q.preference === 'string') return q.preference === 'decaf';
    return q.preference.key === 'decaf';
  });
  if(qIndex === -1) return null;
  const val = answers[qIndex];
  if(val === null) return null;
  if(val >= 1) return true;   // 조금 그렇다 / 매우 그렇다
  if(val <= -1) return false; // 조금 아니다 / 전혀 아니다
  return null;                // 보통이다 -> 선호 없음
}

function cosineSim(a, b){
  let dot=0, na=0, nb=0;
  TRAITS.forEach(t=>{
    dot += (a[t]||0)*(b[t]||0);
    na += (a[t]||0)**2;
    nb += (b[t]||0)**2;
  });
  if(na===0 || nb===0) return -Infinity;
  return dot / (Math.sqrt(na)*Math.sqrt(nb));
}

function matchType(userVec){
  let best=null, bestScore=-Infinity;
  types.forEach(t=>{
    const s = cosineSim(userVec, t.center_score);
    if(s > bestScore){ bestScore=s; best=t; }
  });
  return best;
}

function pickDiverseSecond(scored, first){
  const rest = scored.filter(c=> c.id !== first.id);
  let bestSecond=null, bestScore=-Infinity;
  rest.slice(0, 10).forEach(c=>{
    const overlap = c.cup_notes.filter(n=> first.cup_notes.includes(n)).length;
    const diversityBonus = (c.country_en !== first.country_en ? 0.06 : 0) + (c.process !== first.process ? 0.03 : 0);
    const score = c.similarity - overlap*0.035 + diversityBonus;
    if(score > bestScore){ bestScore=score; bestSecond=c; }
  });
  return bestSecond;
}

function recommendCoffees(userVec, decafPref){
  // 디카페인을 명시적으로 원하는 경우(true)가 아니면, 디카페인 원두는 후보에서 아예 제외한다.
  const basePool = decafPref === true ? coffees : coffees.filter(c=> !c.decaf);

  const scored = basePool.map(c=>({...c, similarity: cosineSim(userVec, c.taste_score)}));
  scored.sort((a,b)=> b.similarity - a.similarity);

  const first = scored[0];

  if(decafPref === true){
    // 디카페인 선호: 추천 2종 중 반드시 1개는 decaf 원두로 보장
    if(first.decaf){
      const second = pickDiverseSecond(scored, first);
      return [first, second];
    }
    const bestDecaf = scored.filter(c=> c.decaf).sort((a,b)=> b.similarity - a.similarity)[0];
    return [first, bestDecaf || pickDiverseSecond(scored, first)];
  }

  const second = pickDiverseSecond(scored, first);
  return [first, second];
}

// 원두 매칭률(%) = 추천에 쓰는 코사인 유사도(-1~1)를 0~100%로 환산
// (추천 순위와 같은 값을 쓰므로 01 원두의 매칭률이 항상 가장 높다)
function matchPercent(userVec, coffee){
  if(!userVec || !coffee) return null;
  const s = cosineSim(userVec, coffee.taste_score);
  if(!Number.isFinite(s)) return null;
  return Math.min(100, Math.max(0, Math.round((s + 1) / 2 * 100)));
}

// 취향 지도용: 가장 높은 항목을 5로 맞춰 비례 환산, 마이너스는 0
function normalizeForMap(vec){
  const out = {};
  const maxPos = Math.max(0, ...TRAITS.map(t => vec[t] || 0));
  TRAITS.forEach(t=>{
    out[t] = maxPos > 0 ? Math.max(0, vec[t] || 0) / maxPos * 5 : 0;
  });
  return out;
}

function parseVecParam(str){
  if(!str) return null;
  const arr = str.split(',').map(Number);
  if(arr.length !== TRAITS.length || !arr.every(Number.isFinite)) return null;
  const vec = {};
  TRAITS.forEach((t,i)=> vec[t] = arr[i]);
  return isZeroVector(vec) ? null : vec;
}

/* =========================================================
   RADAR CHART (SVG)
========================================================= */
const MAIN_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'body', label:'바디'},
  {key:'bitterness', label:'쓴맛'},
  {key:'fruit', label:'과일'},
  {key:'floral', label:'플로럴'},
  {key:'unique', label:'개성'},
  {key:'nutty', label:'고소함'},
  {key:'chocolate', label:'초콜릿'}
];
const MINI_AXES = [
  {key:'acidity', label:'산미'},
  {key:'sweetness', label:'단맛'},
  {key:'bitterness', label:'쓴맛'},
  {key:'body', label:'바디'}
];

function radarPoint(i, n, ratio, cx, cy, r){
  const a = (Math.PI*2 * i/n) - Math.PI/2;
  return [cx + Math.cos(a)*r*ratio, cy + Math.sin(a)*r*ratio];
}

/* series: [{ values, stroke, width, fill, fillOpacity, dash }] */
function radarSVG(axes, series, opts={}){
  const size = opts.size || 300;
  const max = opts.max || 5;
  const cx = size/2, cy = size/2;
  const r = size/2 - (opts.pad || 50);
  const n = axes.length;
  const f = v => v.toFixed(1);
  const poly = ratioAt => axes.map((ax,i)=> radarPoint(i, n, ratioAt(ax), cx, cy, r).map(f).join(',')).join(' ');

  let out = '';
  [1, 0.5].forEach(ratio=>{
    out += `<polygon points="${poly(()=>ratio)}" fill="none" stroke="${ratio===1 ? COLORS.line : COLORS.soft}" stroke-width="1"/>`;
  });
  axes.forEach((ax,i)=>{
    const [x,y] = radarPoint(i, n, 1, cx, cy, r);
    out += `<line x1="${cx}" y1="${cy}" x2="${f(x)}" y2="${f(y)}" stroke="${COLORS.soft}" stroke-width="1"/>`;
  });
  series.forEach(s=>{
    const pts = poly(ax => Math.min(Math.max(s.values[ax.key]||0, 0), max)/max);
    out += `<polygon points="${pts}" fill="${s.fill || 'none'}" fill-opacity="${s.fillOpacity ?? 0}" stroke="${s.stroke}" stroke-width="${s.width || 1.5}" stroke-linejoin="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`;
  });
  const lr = opts.labelRatio || 1.2;
  axes.forEach((ax,i)=>{
    const [x,y] = radarPoint(i, n, lr, cx, cy, r);
    out += `<text x="${f(x)}" y="${f(y)}" fill="${COLORS.muted}" font-size="${opts.labelSize || 11}" font-family="IBM Plex Sans KR, sans-serif" text-anchor="middle" dominant-baseline="middle">${ax.label}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(opts.ariaLabel || '맛 레이더 차트')}">${out}</svg>`;
}

function tasteMapSeries(type, userVec){
  const series = [{ values: type.center_score, stroke: COLORS.ink, width: 1, dash: '3 2.5' }];
  if(userVec){
    series.push({ values: normalizeForMap(userVec), stroke: COLORS.accent, width: 1.5, fill: COLORS.accent, fillOpacity: 0.08 });
  }
  return series;
}

/* =========================================================
   CHARACTER SPRITE ANIMATION
========================================================= */
let spriteTimer = null;
function spriteFrames(typeId){
  return [
    `images/characters/${typeId}_idle.png`,
    `images/characters/${typeId}_pose1.png`,
    `images/characters/${typeId}_pose2.png`
  ];
}
function renderSprite(typeId){
  const frames = spriteFrames(typeId);
  const img = document.getElementById('sprite-img');
  if(!img) return;
  let idx = 0;
  img.src = frames[idx];
  if(spriteTimer) clearInterval(spriteTimer);
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  spriteTimer = setInterval(()=>{
    idx = (idx + 1) % frames.length;
    img.src = frames[idx];
  }, 450);
}

/* =========================================================
   RESULT RENDER
========================================================= */
function goCalculate(){
  showScreen('loading');
  setTimeout(()=>{
    let userVec = computeUserVector();
    const decafPref = computeDecafPreference();

    let matchedType;
    if (isZeroVector(userVec)) {
      matchedType = types.find(t => t.id === "I");
      // 여행자 타입의 기준점으로 userVec을 변경
      userVec = { ...matchedType.center_score };
    } else {
      matchedType = matchType(userVec);
    }

    const [c1, c2] = recommendCoffees(userVec, decafPref);
    renderResult(matchedType, c1, c2, userVec);
    showScreen('result');
  }, 1100);
}

function renderResult(type, c1, c2, userVec){

  cardPromise = buildShareCardBlob().catch(err => { console.error('결과 카드 생성 실패', err); return null; });

/* =========================================================
   SHARE CARD (1080 x 1350, Canvas로 직접 그림)
========================================================= */
const CARD_W = 1080, CARD_H = 1350;
const SANS = "'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const MONO = "'IBM Plex Mono', ui-monospace, Menlo, monospace";

function loadImage(src){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> resolve(null);
    img.src = src;
  });
}

async function ensureCardFonts(sample){
  if(!document.fonts || !document.fonts.load) return;
  const specs = [`300 26px ${SANS}`, `400 26px ${SANS}`, `600 30px ${SANS}`, `400 22px ${MONO}`, `500 28px ${MONO}`];
  try{
    await Promise.all(specs.map(s => document.fonts.load(s, sample)));
  }catch(e){ /* 폰트 로드 실패 시 시스템 폰트로 그림 */ }
}

function drawSpaced(ctx, text, x, y, spacing, align='left'){
  const chars = [...text];
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a,b)=>a+b, 0) + spacing * (chars.length - 1);
  let cx = align === 'right' ? x - total : x;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach((ch, i)=>{ ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
  ctx.textAlign = prevAlign;
}

function wrapLines(ctx, text, maxW, maxLines){
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  const fits = s => ctx.measureText(s).width <= maxW;
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if(fits(test)){ line = test; return; }
    if(line){ lines.push(line); line = ''; }
    if(fits(word)){ line = word; return; }
    let chunk = '';
    for(const ch of word){
      if(!fits(chunk + ch) && chunk){ lines.push(chunk); chunk = ch; }
      else chunk += ch;
    }
    line = chunk;
  });
  if(line) lines.push(line);
  if(lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    while(last.length && !fits(last + '…')) last = last.slice(0, -1);
    kept[maxLines - 1] = last + '…';
    return kept;
  }
  return lines;
}

function hLine(ctx, x1, x2, y, color, w){
  ctx.fillStyle = color;
  ctx.fillRect(x1, y - w/2, x2 - x1, w);
}

function drawRadarCanvas(ctx, cx, cy, r, axes, series, labelPx){
  const n = axes.length;
  const path = ratioAt => {
    ctx.beginPath();
    axes.forEach((ax,i)=>{
      const [x,y] = radarPoint(i, n, ratioAt(ax), cx, cy, r);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
  };
  ctx.lineJoin = 'round';
  [1, 0.5].forEach(ratio=>{
    path(()=>ratio);
    ctx.strokeStyle = ratio === 1 ? COLORS.line : COLORS.soft;
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.stroke();
  });
  ctx.strokeStyle = COLORS.soft; ctx.lineWidth = 2;
  axes.forEach((ax,i)=>{
    const [x,y] = radarPoint(i, n, 1, cx, cy, r);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
  });
  series.forEach(s=>{
    path(ax => Math.min(Math.max(s.values[ax.key]||0, 0), 5)/5);
    if(s.fill){
      ctx.globalAlpha = s.fillOpacity ?? 0.1;
      ctx.fillStyle = s.fill;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.setLineDash(s.dash ? s.dash.split(' ').map(v => Number(v) * 2) : []);
    ctx.strokeStyle = s.stroke;
    ctx.lineWidth = (s.width || 1.5) * 2;
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.font = `400 ${labelPx}px ${SANS}`;
  ctx.fillStyle = COLORS.muted;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  axes.forEach((ax,i)=>{
    const [x,y] = radarPoint(i, n, 1.2, cx, cy, r);
    ctx.fillText(ax.label, x, y);
  });
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

async function buildShareCardBlob(){
  if(!lastRender) return null;
  const { type, beans, userVec } = lastRender;

  const sample = [type.title, type.description, (type.keywords||[]).join(' '),
    ...beans.map(b => [b.coffee.name_ko, b.coffee.country_ko, b.coffee.process, (b.coffee.cup_notes||[]).join(' ')].join(' ')),
    '나 기준 디카페인 MY TASTE PROFILE YOUR TASTE TYPE MATCH 0123456789%·/…'].join(' ');
  const [, charImg] = await Promise.all([ensureCardFonts(sample), loadImage(spriteFrames(type.id)[0])]);

  const canvas = document.createElement('canvas');
  canvas.width = CARD_W; canvas.height = CARD_H;
  const ctx = canvas.getContext('2d');
  const L = 80, R = 1000;

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, CARD_W, CARD_H);

  // 상단 바
  ctx.fillStyle = COLORS.ink;
  ctx.font = `500 28px ${MONO}`;
  drawSpaced(ctx, 'COFFEE TI', L, 108, 3.4);
  ctx.fillStyle = COLORS.muted;
  ctx.font = `400 22px ${MONO}`;
  drawSpaced(ctx, 'MY TASTE PROFILE', R, 106, 1.8, 'right');
  hLine(ctx, L, R, 134, COLORS.ink, 2);

  // 캐릭터 프레임
  const fs = 184, fx = R - fs, fy = 176;
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(fx, fy, fs, fs);
  ctx.strokeStyle = COLORS.soft; ctx.lineWidth = 2;
  for(let g = 20; g < fs; g += 20){
    ctx.beginPath(); ctx.moveTo(fx + g, fy); ctx.lineTo(fx + g, fy + fs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx, fy + g); ctx.lineTo(fx + fs, fy + g); ctx.stroke();
  }
  ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 2;
  ctx.strokeRect(fx + 1, fy + 1, fs - 2, fs - 2);
  if(charImg){
    const s = Math.min(148 / charImg.naturalWidth, 148 / charImg.naturalHeight);
    const w = charImg.naturalWidth * s, h = charImg.naturalHeight * s;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(charImg, fx + (fs - w)/2, fy + (fs - h)/2, w, h);
    ctx.imageSmoothingEnabled = true;
  }

  // 타입
  const textW = fx - L - 36;
  ctx.fillStyle = COLORS.accent;
  ctx.font = `400 22px ${MONO}`;
  drawSpaced(ctx, 'YOUR TASTE TYPE', L, 204, 4);
  let titlePx = 76;
  ctx.font = `600 ${titlePx}px ${SANS}`;
  while(ctx.measureText(type.title).width > textW && titlePx > 48){
    titlePx -= 4; ctx.font = `600 ${titlePx}px ${SANS}`;
  }
  ctx.fillStyle = COLORS.ink;
  ctx.fillText(type.title, L, 292);

  ctx.font = `400 26px ${SANS}`;
  ctx.fillStyle = COLORS.ink2;
  const descLines = wrapLines(ctx, type.description, textW, 2);
  descLines.forEach((ln, i) => ctx.fillText(ln, L, 356 + i * 40));
  ctx.fillStyle = COLORS.ink;
  ctx.fillText((type.keywords || []).join('  /  '), L, 356 + descLines.length * 40 + 22);

  hLine(ctx, L, R, 500, COLORS.line, 2);

  // 취향 지도
  const bx = L, by = 540, bs = 440;
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(bx, by, bs, bs);
  ctx.strokeStyle = COLORS.line; ctx.lineWidth = 2;
  ctx.strokeRect(bx + 1, by + 1, bs - 2, bs - 2);
  drawRadarCanvas(ctx, bx + bs/2, by + bs/2, 150, MAIN_AXES, tasteMapSeries(type, userVec), 22);

  // 범례
  let lx = bx;
  const ly = by + bs + 44;
  ctx.font = `400 22px ${SANS}`;
  ctx.fillStyle = COLORS.muted;
  if(userVec){
    hLine(ctx, lx, lx + 32, ly - 8, COLORS.accent, 4);
    ctx.fillStyle = COLORS.muted;
    ctx.fillText('나', lx + 44, ly);
    lx += 44 + ctx.measureText('나').width + 32;
  }
  ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(lx, ly - 8); ctx.lineTo(lx + 32, ly - 8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = COLORS.muted;
  ctx.fillText(`${type.title} 기준`, lx + 44, ly);

  // 추천 원두
  const cx0 = bx + bs + 48, cw = R - cx0;
  hLine(ctx, cx0, R, by, COLORS.ink, 2);
  let y = by;
  beans.forEach((b, i)=>{
    const c = b.coffee;
    y += 46;
    ctx.font = `400 22px ${MONO}`;
    ctx.fillStyle = COLORS.accent;
    ctx.fillText(pad2(i+1), cx0, y);
    if(b.match !== null){
      ctx.fillStyle = COLORS.ink;
      drawSpaced(ctx, `MATCH ${b.match}%`, R, y, 1, 'right');
    }
    y += 48;
    ctx.font = `600 30px ${SANS}`;
    ctx.fillStyle = COLORS.ink;
    const nameLines = wrapLines(ctx, c.name_ko, cw, 2);
    nameLines.forEach((ln, k) => ctx.fillText(ln, cx0, y + k * 42));
    if(c.name_en){
      y += (nameLines.length - 1) * 42 + 36;
      ctx.font = `400 20px ${SANS}`;
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(wrapLines(ctx, c.name_en, cw, 1)[0] || '', cx0, y);
      y += 40;
    } else {
      y += (nameLines.length - 1) * 42 + 40;
    }
    ctx.font = `400 22px ${SANS}`;
    ctx.fillStyle = COLORS.muted;
    const meta = [c.country_ko, c.process].filter(Boolean).join(' · ') + (c.decaf ? ' · 디카페인' : '');
    ctx.fillText(wrapLines(ctx, meta, cw, 1)[0] || '', cx0, y);
    y += 36;
    ctx.fillStyle = COLORS.ink;
    const noteLines = wrapLines(ctx, (c.cup_notes || []).join(' · '), cw, 2);
    noteLines.forEach((ln, k) => ctx.fillText(ln, cx0, y + k * 34));
    y += (noteLines.length - 1) * 34 + 32;
    hLine(ctx, cx0, R, y, COLORS.line, 2);
  });

  // 하단
  hLine(ctx, L, R, 1236, COLORS.line, 2);
  ctx.font = `400 22px ${MONO}`;
  ctx.fillStyle = COLORS.muted;
  const siteUrl = (window.location.host + window.location.pathname).replace(/index\.html$/, '').replace(/\/$/, '');
  drawSpaced(ctx, siteUrl || 'COFFEE TI', L, 1290, 0.5);
  drawSpaced(ctx, 'COFFEE TI', R, 1290, 2, 'right');

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

/* =========================================================
   SAVE AS IMAGE
========================================================= */
function downloadBlob(blob, filename){
  const link = document.createElement('a');
  link.download = filename;
  link.href = URL.createObjectURL(blob);
  link.click();
  setTimeout(()=> URL.revokeObjectURL(link.href), 4000);
}

const btnSave = document.getElementById('btn-save');
btnSave.addEventListener('click', async ()=>{
  if(!lastRender) return;
  const label = btnSave.textContent;
  btnSave.disabled = true;
  btnSave.textContent = '이미지 만드는 중...';
  try{
    let blob = cardPromise ? await cardPromise : null;
    if(!blob) blob = await buildShareCardBlob();
    if(!blob) throw new Error('empty blob');
    const filename = `coffee-ti-${lastRender.type.id}.png`;
    const file = new File([blob], filename, {type:'image/png'});

    // 모바일(iOS/Android): 네이티브 공유 시트로 "사진에 저장"까지 한번에
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({ files:[file], title:'COFFEE TI 결과', text:'나의 커피 취향 결과' });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return; // 사용자가 공유 취소
        // 공유 실패 시 아래 다운로드 방식으로 대체
      }
    }
    // PC 등 Web Share 미지원 환경: 파일 다운로드
    downloadBlob(blob, filename);
  }catch(err){
    console.error('결과 저장 실패', err);
    alert('이미지를 저장하지 못했어요. 다시 시도해 주세요.');
  }finally{
    btnSave.disabled = false;
    btnSave.textContent = label;
  }
});

/* =========================================================
   SHARE RESULT LINK
========================================================= */
function buildShareUrl(){
  const url = new URL(window.location.origin + window.location.pathname);
  if(currentResult.typeId) url.searchParams.set('type', currentResult.typeId);
  if(currentResult.c1Id) url.searchParams.set('c1', currentResult.c1Id);
  if(currentResult.c2Id) url.searchParams.set('c2', currentResult.c2Id);
  // 공유받은 사람도 같은 취향 지도·매칭률을 볼 수 있도록 취향 벡터를 함께 전달
  if(currentResult.vec) url.searchParams.set('v', TRAITS.map(t => currentResult.vec[t] || 0).join(','));
  return url.toString();
}

document.getElementById('btn-share').addEventListener('click', async ()=>{
  const shareUrl = buildShareUrl();
  const typeTitle = document.getElementById('type-title').textContent;
  const shareData = {
    title: 'COFFEE TI | 나의 커피 취향',
    text: `나의 커피 취향은 [${typeTitle}] — 당신의 커피 취향도 확인해보세요.`,
    url: shareUrl
  };

  if(navigator.share){
    try{ await navigator.share(shareData); }
    catch(err){ if(err && err.name !== 'AbortError') console.error('공유 실패', err); }
    return;
  }

  try{
    await navigator.clipboard.writeText(shareUrl);
    alert('결과 링크가 복사되었습니다.');
  }catch(err){
    prompt('아래 링크를 복사해주세요', shareUrl);
  }
});
